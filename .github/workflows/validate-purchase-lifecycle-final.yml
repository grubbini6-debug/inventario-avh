name: Validate purchase lifecycle final
on:
  push:
    branches: [feat/purchase-lifecycle-complete]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check AVH V3
        working-directory: v3
        run: node scripts/check.mjs
      - name: Check purchase lifecycle JS
        working-directory: v3
        run: |
          node --check src/features/purchases/smart-purchase-flow.js
          node --check src/features/purchases/purchase-lifecycle.js
      - name: Check lifecycle contracts
        working-directory: v3
        run: |
          grep -q "register_purchase_receipt_document" backend-contract.json
          grep -q "purchase-lifecycle.js" build-manifest.json
          grep -q "purchase-order-pdf" src/features/purchases/smart-purchase-flow.js
          grep -q "purchase_product_conversion_guard" migrations/20260903_purchase_product_conversion_guard.sql || true
          test -s edge-functions/purchase-order-pdf/index.ts
