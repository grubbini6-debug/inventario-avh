name: Validate AI purchase flow
on:
  push:
    branches: [feat/ai-purchase-to-po]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check AVH V3
        working-directory: v3
        run: node scripts/check.mjs
