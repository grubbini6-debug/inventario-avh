name: Validate delete purchase

on:
  push:
    branches:
      - feature/delete-purchase

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate AVH V3
        working-directory: v3
        run: node scripts/check.mjs
