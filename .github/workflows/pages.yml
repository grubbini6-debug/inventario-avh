name: Deploy Inventario AVH

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validar y construir AVH V3
        working-directory: v3
        run: node scripts/check.mjs

      - name: Verificar sitio a publicar
        run: |
          set -euo pipefail
          test -s v3/dist/index.html
          test -s v3/dist/app.css
          test -s v3/dist/app.js
          grep -q '<title>Inventario AVH</title>' v3/dist/index.html
          grep -q 'renderPurchases' v3/dist/app.js
          if grep -q 'patch11.js' v3/dist/index.html; then
            echo 'ERROR: Pages no debe volver a publicar la arquitectura de patches.'
            exit 1
          fi
          echo 'AVH V3 lista para publicar.'

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./v3/dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
