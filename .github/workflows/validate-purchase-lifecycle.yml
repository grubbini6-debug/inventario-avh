name: Validate purchase lifecycle
on:
  push:
    branches: [feat/purchase-lifecycle-complete]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check AVH V3
        working-directory: v3
        run: node scripts/check.mjs
      - name: Check new modules
        working-directory: v3
        run: |
          node --check src/features/purchases/smart-purchase-flow.js
          node --check src/features/purchases/purchase-lifecycle.js
          test -s edge-functions/purchase-order-pdf/index.ts
          test -s migrations/20260903_purchase_lifecycle_complete.sql
