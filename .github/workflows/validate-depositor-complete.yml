name: Validate depositor complete
on:
  push:
    branches: [fix/depositor-complete-mobile]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check AVH V3
        working-directory: v3
        run: node scripts/check.mjs
      - name: Check depositor complete module
        working-directory: v3
        run: |
          node --check src/features/inventory/depositor-complete-mobile.js
          grep -q "openMovement('initial')" src/features/inventory/depositor-complete-mobile.js
          grep -q "openMovement('entry')" src/features/inventory/depositor-complete-mobile.js
          grep -q "openMovement('transfer')" src/features/inventory/depositor-complete-mobile.js
          grep -q "openMovement('return')" src/features/inventory/depositor-complete-mobile.js
          grep -q "receive_transfer" src/features/inventory/depositor-complete-mobile.js
          grep -q "openNewSupplyRequest" src/features/inventory/depositor-complete-mobile.js
          grep -q "register_purchase_receipt_document" src/features/inventory/depositor-complete-mobile.js
