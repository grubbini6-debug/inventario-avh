name: Preparar migración de costos por módulo

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hull-cost-prepare.yml'

permissions:
  contents: read

jobs:
  prepare:
    if: github.head_ref == 'feat/barge-module-costs-20261020'
    runs-on: ubuntu-latest
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Leer cambios relevantes de Supabase
        run: |
          node --input-type=module <<'JS'
          const r=await fetch('https://supabase.com/changelog.md');
          if(!r.ok)throw Error('Changelog '+r.status);
          const s=await r.text();
          console.log(s.split('\n').filter(l=>/breaking-change|postgres|security_invoker/i.test(l)).slice(0,40).join('\n')||'No relevant breaking-change tags in changelog index.');
          JS
      - name: Crear migración con la CLI oficial
        run: |
          npx --yes supabase@2.121.0 --version
          npx --yes supabase@2.121.0 --help
          npx --yes supabase@2.121.0 migration --help
          npx --yes supabase@2.121.0 migration new --help
          mkdir -p /tmp/avh-hull-migration
          npx --yes supabase@2.121.0 migration new barge_module_costing --workdir /tmp/avh-hull-migration
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const dir='/tmp/avh-hull-migration/supabase/migrations';
          const files=fs.readdirSync(dir).filter(x=>x.endsWith('_barge_module_costing.sql'));
          if(files.length!==1)throw Error('Expected one CLI migration');
          const target=path.join('v3/migrations',files[0]);
          fs.copyFileSync(path.join(dir,files[0]),target,fs.constants.COPYFILE_EXCL);
          console.log('MIGRATION_PATH='+target);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: hull-migration-template
          path: v3/migrations/*_barge_module_costing.sql
          retention-days: 7
          if-no-files-found: error
