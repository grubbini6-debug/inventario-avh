name: Validar Inventario AVH V3

on:
  push:
    branches: [refactor-v3]
  pull_request:
    branches: [main]
    paths:
      - 'v3/**'
      - '.github/workflows/v3-check.yml'

permissions:
  contents: read

jobs:
  check-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Node para pruebas
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: v3/package-lock.json

      - name: Instalar dependencias de pruebas
        working-directory: v3
        run: npm ci --ignore-scripts

      - name: Probar regresiones y autorización RPC en PostgreSQL aislado
        working-directory: v3
        run: npm test

      - name: Validar estructura y construir V3
        working-directory: v3
        run: node scripts/check.mjs

      - name: Verificar artefacto
        working-directory: v3
        run: |
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/app.css
          grep -q '<title>Inventario AVH</title>' dist/index.html
          grep -q 'renderPurchases' dist/app.js

      - name: Smoke test real en navegador
        working-directory: v3
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --allow-file-access-from-files \
            --virtual-time-budget=3000 \
            --dump-dom "file://$PWD/dist/index.html" \
            > /tmp/avh-v3-dom.html 2> /tmp/avh-v3-browser.log
          grep -q 'data-avh-boot="ok"' /tmp/avh-v3-dom.html
          grep -q 'id="loginForm"' /tmp/avh-v3-dom.html
          if grep -Eiq 'Uncaught|ReferenceError|TypeError|SyntaxError|AVH boot error' /tmp/avh-v3-browser.log; then
            cat /tmp/avh-v3-browser.log
            exit 1
          fi
          echo 'Browser smoke OK.'

      - name: Guardar artefacto V3 validado
        uses: actions/upload-artifact@v4
        with:
          name: avh-v3-preview
          path: v3/dist
          retention-days: 7
          if-no-files-found: error
