name: Validate OC final
on:
  push:
    branches: [fix/oc-final-release]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar AVH V3
        working-directory: v3
        run: node scripts/check.mjs
      - name: Validar frontend OC
        working-directory: v3
        run: |
          node --check src/features/purchases/po-polish.js
          grep -q "generated_professional_header_v3" src/features/purchases/po-polish.js
          test -s src/assets/logo-avh.png
          file src/assets/logo-avh.png | grep -q PNG
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validar generador PDF
        working-directory: v3
        run: |
          deno check edge-functions/purchase-order-pdf/index.ts
          grep -q "generated_professional_header_v3" edge-functions/purchase-order-pdf/index.ts
          grep -q "ORDEN DE COMPRA" edge-functions/purchase-order-pdf/index.ts
          grep -q "COMPRADOR" edge-functions/purchase-order-pdf/index.ts
