name: Validate opening inventory
on:
  push:
    branches: [feat/opening-inventory-valuation]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar AVH
        working-directory: v3
        run: |
          node scripts/check.mjs
          node --check src/core/state.js
          node --check src/core/data-views.js
          node --check src/features/admin/base.js
          node --check src/features/admin/opening-inventory.js
          node --check src/features/inventory/forms-and-presentations.js
          node --check src/features/inventory/operations.js
          node --check src/features/inventory/depositor-complete-mobile.js
          grep -q 'opening-inventory.js' build-manifest.json
          grep -q 'admin_price_initial_inventory' migrations/20260904_opening_inventory.sql
          grep -q 'opening_session_id' migrations/20260904_opening_inventory.sql
          ! grep -q "\['entry','initial','return'\]" src/features/inventory/forms-and-presentations.js
