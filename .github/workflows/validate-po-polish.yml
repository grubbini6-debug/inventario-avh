name: Validate PO polish
on:
  push:
    branches: [fix/po-logos-speed]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check AVH V3
        working-directory: v3
        run: node scripts/check.mjs
      - name: Check PO assets
        working-directory: v3
        run: |
          test -s dist/assets/logo-avh.jpg
          test -s dist/assets/logo-maqmoveis.jpg
          node --check src/features/purchases/po-polish.js
          grep -q "reused:true" edge-functions/purchase-order-pdf/index.ts
