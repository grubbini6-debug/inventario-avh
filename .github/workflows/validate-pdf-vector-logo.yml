name: Validate PDF vector logo
on:
  push:
    branches: [fix/pdf-avh-logo-embedded]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check AVH V3
        working-directory: v3
        run: node scripts/check.mjs
      - name: Check PO frontend
        working-directory: v3
        run: |
          node --check src/features/purchases/po-polish.js
          grep -q "generated_vector_logo_v2" src/features/purchases/po-polish.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check PO Edge Function
        working-directory: v3
        run: |
          deno check edge-functions/purchase-order-pdf/index.ts
          grep -q "drawAvhVectorLogo" edge-functions/purchase-order-pdf/index.ts
          grep -q "generated_vector_logo_v2" edge-functions/purchase-order-pdf/index.ts
