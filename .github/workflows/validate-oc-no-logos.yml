name: Validate OC no logos
on:
  push:
    branches: [fix/oc-no-logos]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar frontend AVH
        working-directory: v3
        run: |
          node scripts/check.mjs
          node --check src/features/purchases/po-polish.js
          grep -q 'generated_professional_header_v6_no_logo' src/features/purchases/po-polish.js
          ! grep -q 'po-logo-wrap' src/features/purchases/po-polish.js
          ! grep -q 'assets/logo-' src/features/purchases/po-polish.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validar generador PDF
        run: |
          deno check v3/edge-functions/purchase-order-pdf/index.ts
          grep -q 'generated_professional_header_v6_no_logo' v3/edge-functions/purchase-order-pdf/index.ts
          ! grep -q 'logo-avh' v3/edge-functions/purchase-order-pdf/index.ts
          ! grep -q 'logo-maqmoveis' v3/edge-functions/purchase-order-pdf/index.ts
          ! grep -q 'embedPng\|embedJpg\|drawImage' v3/edge-functions/purchase-order-pdf/index.ts
