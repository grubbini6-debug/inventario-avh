name: Validate purchase control
on:
  push:
    branches: [feat/purchase-document-control]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar AVH
        working-directory: v3
        run: |
          node scripts/check.mjs
          node --check src/features/purchases/purchase-document-control.js
          node --check src/features/purchases/smart-purchase-flow.js
          node --check src/features/purchases/purchase-lifecycle.js
          node --check src/features/inventory/depositor-complete-mobile.js
          grep -q 'purchase-document-control.js' build-manifest.json
          grep -q 'analysis_data' migrations/20260904_purchase_document_control.sql
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validar Edge
        run: |
          deno check v3/edge-functions/purchase-invoice-control-ai/index.ts
          grep -q 'purchase_invoice_analyzed' v3/edge-functions/purchase-invoice-control-ai/index.ts
          ! grep -q 'receive_purchase' v3/edge-functions/purchase-invoice-control-ai/index.ts
