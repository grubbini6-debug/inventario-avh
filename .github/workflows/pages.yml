name: Deploy Inventario AVH

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Exigir integración por Pull Request
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COUNT="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '[.[] | select(.merged_at != null)] | length')"
          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: producción solo se publica desde cambios integrados mediante Pull Request."
            exit 1
          fi
          echo "Commit asociado a PR mergeado: OK"


      - name: Validar y construir AVH V3
        working-directory: v3
        run: node scripts/check.mjs

      - name: Verificar sitio a publicar
        run: |
          set -euo pipefail
          test -s v3/dist/index.html
          test -s v3/dist/app.css
          test -s v3/dist/app.js
          grep -q '<title>Inventario AVH</title>' v3/dist/index.html
          grep -q 'renderPurchases' v3/dist/app.js
          if grep -q 'patch11.js' v3/dist/index.html; then
            echo 'ERROR: Pages no debe volver a publicar la arquitectura de patches.'
            exit 1
          fi
          sed -i "s#href=\"app.css\"#href=\"app.css?v=${GITHUB_SHA}\"#; s#src=\"app.js\"#src=\"app.js?v=${GITHUB_SHA}\"#" v3/dist/index.html
          grep -q "app.css?v=${GITHUB_SHA}" v3/dist/index.html
          grep -q "app.js?v=${GITHUB_SHA}" v3/dist/index.html
          echo 'AVH V3 lista para publicar con cache-busting.'

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./v3/dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
