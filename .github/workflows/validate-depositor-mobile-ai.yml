name: Validate depositor mobile AI
on:
  push:
    branches: [feat/depositor-mobile-ai]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check AVH V3
        working-directory: v3
        run: node scripts/check.mjs
      - name: Check depositor module
        working-directory: v3
        run: |
          node --check src/features/inventory/depositor-mobile-ai.js
          test -s edge-functions/depositor-photo-ai/index.ts
          grep -q 'data-page="home"' src/features/inventory/depositor-mobile-ai.js
          grep -q 'record_exit' src/features/inventory/depositor-mobile-ai.js
          grep -q 'receive_purchase' src/features/inventory/depositor-mobile-ai.js
