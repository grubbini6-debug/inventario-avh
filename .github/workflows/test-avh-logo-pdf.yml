name: Test AVH logo PDF
on:
  push:
    branches: [fix/oc-avh-logo-jpeg]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Generar PDF de prueba
        run: |
          cat > /tmp/test.ts <<'TS'
          import { PDFDocument } from 'npm:pdf-lib@1.17.1';
          import { PNG } from 'npm:pngjs@7.0.0';
          import { Buffer } from 'node:buffer';
          const url='https://grubbini6-debug.github.io/inventario-avh/assets/logo-avh.png';
          const r=await fetch(url); if(!r.ok) throw new Error('logo '+r.status);
          const raw=new Uint8Array(await r.arrayBuffer());
          const img=PNG.sync.read(Buffer.from(raw));
          for(let i=0;i<img.data.length;i+=4){
            const a=img.data[i+3]/255;
            img.data[i]=Math.round(img.data[i]*a+255*(1-a));
            img.data[i+1]=Math.round(img.data[i+1]*a+255*(1-a));
            img.data[i+2]=Math.round(img.data[i+2]*a+255*(1-a));
            img.data[i+3]=255;
          }
          const flat=new Uint8Array(PNG.sync.write(img,{colorType:2,inputColorType:6,inputHasAlpha:true}));
          const pdf=await PDFDocument.create(); const page=pdf.addPage([595.28,841.89]);
          const logo=await pdf.embedPng(flat); const d=logo.scale(1), ratio=Math.min(136/d.width,48/d.height);
          page.drawImage(logo,{x:36+(136-d.width*ratio)/2,y:768+(48-d.height*ratio)/2,width:d.width*ratio,height:d.height*ratio});
          await Deno.writeFile('avh-logo-test.pdf',await pdf.save());
          TS
          deno run --allow-net --allow-write /tmp/test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: avh-logo-test
          path: avh-logo-test.pdf
